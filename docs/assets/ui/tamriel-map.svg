<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="Stylized map of Tamriel">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1828"/><stop offset="100%" stop-color="#122838"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a5a38"/><stop offset="55%" stop-color="#2a4830"/><stop offset="100%" stop-color="#1a3020"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="900" height="700" fill="url(#sea)"/>
  <!-- stylized continent -->
  <path d="M130,200 C170,120 280,70 420,75 C560,80 680,120 760,190 C820,250 830,340 790,420
           C750,500 680,560 560,590 C440,620 320,600 230,530 C150,470 110,360 130,200 Z"
        fill="url(#land)" stroke="#d4af37" stroke-width="3" filter="url(#glow)"/>
  <!-- inland water -->
  <ellipse cx="470" cy="310" rx="55" ry="42" fill="#0e2838" stroke="#3a6080" stroke-width="1"/>
  <ellipse cx="340" cy="230" rx="38" ry="28" fill="#0e2838" stroke="#3a6080" stroke-width="1"/>
  <!-- mountain hatch -->
  <path d="M500,180 l20,40 -40,0 z M560,200 l16,32 -32,0 z M420,400 l18,36 -36,0 z" fill="#1a2818" stroke="#8a9a60" stroke-width="1" opacity="0.7"/>
  <!-- region labels (faint) -->
  <g fill="#c4b39a" font-family="Cinzel,serif" font-size="13" opacity="0.55">
    <text x="210" y="210">HIGH ROCK</text>
    <text x="200" y="380">HAMMERFELL</text>
    <text x="360" y="470">ELSEWEYR</text>
    <text x="420" y="540">VALENWOOD</text>
    <text x="560" y="380">MORROWIND</text>
    <text x="500" y="200">SKYRIM</text>
    <text x="700" y="260">OBLIVION</text>
  </g>
  <text x="24" y="36" fill="#f0e6b4" font-family="Cinzel,serif" font-size="22">TAMRIEL — Road of the Provinces</text>
  <text x="24" y="58" fill="#8a7a60" font-family="Crimson Pro,serif" font-size="12">Fan stylized map · not affiliated with Bethesda Softworks</text>
  <text x="24" y="680" fill="#6a7a88" font-family="serif" font-size="11">Challenge stops marked on the road — play in order each New York calendar day</text>
</svg>
